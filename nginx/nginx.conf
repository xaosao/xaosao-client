# nginx reverse proxy for xaosao-client
#
# What this file does:
#   1. Load-balances between all Docker Compose replicas of `xaosao-client`.
#      Docker's internal DNS resolves the service name to the current set
#      of container IPs; the `hash` directive below turns round-robin into
#      cookie-based sticky sessions.
#   2. Pins each browser to one replica via `xaosao_sticky` cookie so the
#      in-process query cache (cache.server.ts) actually delivers hits.
#   3. Streams SSE endpoints unbuffered so notification events flush
#      immediately instead of arriving in gzipped chunks.
#   4. Sets long-connection timeouts for SSE (3600 s) so notification
#      streams don't drop every 60 s from nginx's default proxy_read_timeout.
#
# Scaling: no changes needed. `docker compose up -d --scale xaosao-client=N`
# and Docker DNS returns N IPs. `hash consistent` reshuffles the minimum
# number of sticky assignments when N changes.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────────
    # Include upstream latency + the replica that served each request so
    # you can spot a slow replica in the access log.
    log_format proxied '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log proxied;

    # ─── Base transport tuning ────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    server_tokens off;

    # Loader responses can hit ~500 KB after our optimizations —
    # bump the proxy buffer sizes so nginx doesn't spill to disk.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    client_max_body_size 25m;  # profile image uploads

    # gzip AT THE EDGE for anything not already compressed by Node.
    # Node's compression middleware handles most traffic; this is a
    # safety net for anything that slips through.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # ─── Upstream pool ────────────────────────────────────────────────
    # `hash $sticky consistent` is what makes sticky sessions work.
    # `consistent` means when you scale N→N+1, only ~1/N of clients get
    # re-hashed to a new replica — cache warm-up impact is minimal.
    upstream xaosao_backend {
        hash $sticky consistent;
        # Docker's embedded DNS resolves this to every replica's IP.
        # No need to list them individually.
        server xaosao-client:3000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # ─── Sticky cookie derivation ─────────────────────────────────────
    # If the client already has an xaosao_sticky cookie, use its value.
    # Otherwise seed one from nginx's per-request random id — that id
    # becomes the client's cookie via the Set-Cookie header below.
    map $cookie_xaosao_sticky $sticky {
        default $cookie_xaosao_sticky;
        ""      $request_id;
    }

    # ─── Server block ─────────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # Local-only nginx status endpoint — doesn't hit the upstream
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # SSE endpoints: unbuffered, long timeouts, no compression.
        # These match the routes in app/routes.ts.
        location ~ ^/api/(notifications/(customer|model)-sse|subscription-events) {
            proxy_pass http://xaosao_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # The whole point of SSE — don't buffer, don't compress
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            gzip off;

            # Long-lived streams — 1h read/send timeout
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Ensure the sticky cookie is set on first SSE handshake too
            add_header Set-Cookie "xaosao_sticky=$sticky; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400" always;
        }

        # Everything else: standard HTTP proxy with sticky cookie.
        location / {
            proxy_pass http://xaosao_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Give slow loaders room. The DB-side caching we shipped
            # should keep p95 well under 5 s, but production Mongo cold
            # queries can spike higher — pick something you'll notice
            # in logs but that won't kill legitimate requests.
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;

            # Persist stickiness for 24 h. Users returning after that
            # get re-hashed (fine — cache is short-lived anyway).
            add_header Set-Cookie "xaosao_sticky=$sticky; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400" always;
        }
    }
}
